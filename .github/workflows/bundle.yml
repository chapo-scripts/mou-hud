name: Bundle Moonly Project

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  bundle:
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download moonly CLI
        shell: pwsh
        run: |
          $url = "https://github.com/themusaigen/moonly-command-tool/releases/latest/download/moonly.exe"
          Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP\moonly.exe"
          echo "$env:RUNNER_TEMP" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Run moonly bundle
        run: moonly bundle

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: bundled-script
          path: dist/
          if-no-files-found: error

      - name: Publish release (latest)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          body: |
            Bundling from commit ${{ github.sha }}
            Author: ${{ github.actor }}
            Date: ${{ github.event.head_commit.timestamp }}
          prerelease: false
          files: dist/*.lua
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}